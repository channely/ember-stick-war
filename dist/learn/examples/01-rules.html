<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 · 用豆子造一个兵营</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f7f2e6;color:#293b32;font:16px/1.65 system-ui,sans-serif}main{max-width:760px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{margin:9px 0;color:#657362}button,select,input{font:inherit}button{background:#426a4d;color:#fff6df;border:0;border-radius:7px;padding:10px 17px;cursor:pointer;margin:4px 6px 4px 0}button:disabled{opacity:.4;cursor:default}button.secondary{background:#e5decb;color:#52634c}label{display:inline-flex;align-items:center;gap:10px;margin:8px 16px 8px 0}canvas{display:block;width:100%;background:#d9ebd0;border:1px solid #b6c8aa;border-radius:12px;margin:15px 0}.board{background:#fffdf4;border:1px solid #ddd6bf;border-radius:10px;padding:18px;margin:15px 0}.numbers{display:flex;gap:14px;flex-wrap:wrap}.number{background:#ece4c8;padding:10px 16px;border-radius:8px}.number b{font-size:24px;color:#486b43}output{display:block;min-height:30px;margin:10px 0;color:#9e6c36}code{background:#e8e2ce;padding:2px 5px;border-radius:3px}small{color:#7f876d}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid #ddd6bf;padding:7px}.states{display:flex;gap:8px;flex-wrap:wrap}.states span{padding:6px 10px;background:#e8e4d2;border-radius:5px}.states .active{background:#426a4d;color:white}@media(max-width:500px){body{padding:15px}h1{font-size:21px}button{padding:9px 12px}.number{padding:8px 12px}}</style>
<main>
<h1>01 · 用豆子造一个兵营</h1>
<p>先开采，再最多买一名。新矿工从下一回合开始工作。第 6 回合末，争取拥有 2 名守卫和 2 黄金。</p>

<div class="numbers"><span class="number">回合 <b id="round">0</b> / 6</span><span class="number">黄金 <b id="gold">4</b></span><span class="number">矿工 <b id="miners">1</b></span><span class="number">守卫 <b id="guards">0</b></span></div>
<div class="board"><button id="next">开始回合 · 开采</button><button id="miner" disabled>买矿工 · 3 金</button><button id="guard" disabled>买守卫 · 4 金</button><button id="wait" disabled>这次等待</button><button id="reset" class="secondary">重新摆豆子</button><output id="message">先预测：你想先买谁？</output></div>
<table><thead><tr><th>回合</th><th>选择</th><th>黄金</th><th>矿工</th><th>守卫</th></tr></thead><tbody id="log"></tbody></table>
<script>
"use strict";

// 四个记事盒；phase 记录当前应该做哪一步。
let gold=4,miners=1,guards=0,round=0,phase='mine';
const $=id=>document.getElementById(id);
function show(){for(const [id,value] of Object.entries({gold,miners,guards,round}))$(id).textContent=value;
  $('next').disabled=phase!=='mine';$('miner').disabled=phase!=='buy'||gold<3;
  $('guard').disabled=phase!=='buy'||gold<4;$('wait').disabled=phase!=='buy';}
$('next').onclick=()=>{if(phase!=='mine')return;round++;gold+=miners;phase='buy';$('message').textContent='开采完毕！现在买一名，或者等待。';show();};
function choose(type){if(phase!=='buy')return;let label='等待';
  if(type==='miner'){if(gold<3)return;gold-=3;miners++;label='买矿工';}
  if(type==='guard'){if(gold<4)return;gold-=4;guards++;label='买守卫';}
  $('log').insertAdjacentHTML('beforeend',`<tr><td>${round}</td><td>${label}</td><td>${gold}</td><td>${miners}</td><td>${guards}</td></tr>`);
  phase=round>=6?'end':'mine';$('message').textContent=phase==='end'?(guards>=2&&gold>=2?'目标达成！说说哪一步帮助了你。':'试验完成。下一局想只改哪一步？'):'已记录。下一回合才会再次开采。';show();
}
$('miner').onclick=()=>choose('miner');$('guard').onclick=()=>choose('guard');$('wait').onclick=()=>choose('wait');
$('reset').onclick=()=>{gold=4;miners=1;guards=0;round=0;phase='mine';$('log').textContent='';$('message').textContent='新一局，先留下你的预测。';show();};show();

</script>
<p><small>小设计师任务：把起始黄金 gold=4 改成 3。只改这一处，再比较两局。</small></p>
</main>
</html>
